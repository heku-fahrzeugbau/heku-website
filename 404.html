<!DOCTYPE html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Seite nicht gefunden – HEKU Fahrzeugbau</title>
  <meta name="robots" content="noindex">
  <script>
    const redirects = {

      // --- Seiten (ehem. WordPress-URLs → neue .html-Struktur) ---
      "/bootsanhaenger/":              "/bootstrailer.html",
      "/bootsanhaenger-basis/":        "/bootstrailer.html",
      "/anhaenger/":                   "/produkte.html",
      "/zubehoer/":                    "/shop.html",
      "/download/":                    "/produkte.html",
      "/galerie/":                     "/ueber-uns.html",
      "/technik/":                     "/wasserdichte-radnabe.html",
      "/steckerbelegung/":             "/ratgeber-bootsanhaenger.html",
      "/vor-der-fahrt/":               "/ratgeber-bootsanhaenger.html",
      "/geschwindigkeitsbegrenzung/":  "/ratgeber-bootsanhaenger.html",
      "/motorradanhaenger-2/":         "/produkte.html",
      "/wohnmobile/":                  "/wohnmobile.html",

      // --- Pflichtseiten (Trailing-Slash → .html) ---
      "/ueber-uns/":                   "/ueber-uns.html",
      "/haendler/":                    "/haendler.html",
      "/kontakt/":                     "/kontakt.html",
      "/datenschutz/":                 "/datenschutz.html",
      "/impressum/":                   "/impressum.html",

      // --- PDFs: Bootsanhänger-Preislisten → bootstrailer.html ---
      "/wp-content/uploads/2018/01/B-Serie.pdf":                               "/bootstrailer.html",
      "/wp-content/uploads/2021/03/Preisliste-B-Serie-2021-Neu.pdf":           "/bootstrailer.html",
      "/wp-content/uploads/2019/01/Preisliste-B-Serie-2019-1.pdf":             "/bootstrailer.html",
      "/wp-content/uploads/2016/09/Boot-Flyer-2016.pdf":                       "/bootstrailer.html",

      // --- PDFs: Komfort/SP-Serie → produkte.html ---
      "/wp-content/uploads/2017/09/Preisliste-komfortserie-25-2016.pdf":       "/produkte.html",
      "/wp-content/uploads/2016/10/Komfort-Preisliste_2016_2.pdf":             "/produkte.html",
      "/wp-content/uploads/2019/01/PRL_SP-Serie_2019-1-converted.pdf":         "/produkte.html",
      "/wp-content/uploads/2018/06/PRL_SP-Serie_2018.pdf":                     "/produkte.html",
      "/wp-content/uploads/2021/02/HB-Preisliste-2021.pdf":                    "/produkte.html",

      // --- PDFs: Zubehör → shop.html ---
      "/wp-content/uploads/2021/02/Preise-fuer-Zubehoer-2021-konvertiert.pdf": "/shop.html",

      // --- PDFs: Motorrad-Anhänger (eingestellt) → produkte.html ---
      "/wp-content/uploads/2017/01/Motorrad-Anhaenger-Preis-2017.pdf":         "/produkte.html",
      "/wp-content/uploads/2018/02/HEKU_Motorrad-Anhaenger-18.pdf":            "/produkte.html",

      // --- Produktübersicht: Slash und Großschreibung (GitHub Pages 404) ---
      "/produkte/":                    "/produkte.html",
      "/produkte":                     "/produkte.html",

      // --- Entfernte Shop-Artikel: kein Nachfolgeartikel, Kategorie des alten Datensatzes ---
      "/artikel/50238.html":           "/weiteres-bootsanhaenger-zubehoer.html"

    };

    // Extensionless and trailing-slash forms of real pages. Lookup is
    // case-insensitive, so /Produkte, /Produkte/ and /PRODUKTE.html match too.
    // Legacy WordPress keys above win first (/bootsanhaenger/ stays on bootstrailer.html).
    const htmlAliases = {
      "/produkte": "/produkte.html",
      "/shop": "/shop.html",
      "/konfigurator": "/konfigurator.html",
      "/segelbootanhaenger": "/segelbootanhaenger.html",
      "/motorbootanhaenger": "/motorbootanhaenger.html",
      "/jollenanhaenger": "/jollenanhaenger.html",
      "/ruderbootanhaenger": "/ruderbootanhaenger.html",
      "/bootstrailer": "/bootstrailer.html",
      "/bootsanhaenger-nach-mass": "/bootsanhaenger-nach-mass.html",
      "/bootsanhaenger-bielefeld": "/bootsanhaenger-bielefeld.html",
      "/faq": "/faq.html",
      "/dinghyanhaenger": "/jollenanhaenger.html"
    };

    function redirectTarget(pathname) {
      if (redirects[pathname]) return redirects[pathname];
      let value = pathname || "/";
      try { value = decodeURIComponent(value); } catch (e) {}
      if (redirects[value]) return redirects[value];
      const lower = value.toLowerCase();
      const stripped = lower.length > 1 ? lower.replace(/\/+$/, "") : lower;
      for (const key of Object.keys(redirects)) {
        const folded = key.toLowerCase();
        const keyStripped = folded.length > 1 ? folded.replace(/\/+$/, "") : folded;
        if (folded === lower || folded === stripped || keyStripped === stripped || keyStripped === lower) return redirects[key];
      }
      const bare = stripped.replace(/\.html$/, "");
      return htmlAliases[bare] || null;
    }

    const path = window.location.pathname;
    const target = redirectTarget(path);

    if (target && target !== path) {
      window.location.replace(target);
    }
  </script>
</head>
<body>
  <h1>Seite nicht gefunden</h1>
  <p>Diese Seite existiert nicht mehr. Du wirst weitergeleitet – oder klicke hier: <a href="/produkte.html">Zur Produktübersicht</a></p>
</body>
</html>
