<script>
/* HEKU Lead- & Event-Tracking ------------------------------------------------
   Robust: bricht nie, auch wenn GA4 blockiert/geladen wird nicht.            */
(function () {
  "use strict";

  // Sicherer gtag-Wrapper: schluckt Fehler, wenn gtag fehlt/geblockt ist.
  function hekuTrack(eventName, params) {
    try {
      if (typeof window.gtag === "function") {
        window.gtag("event", eventName, params || {});
      }
    } catch (e) { /* absichtlich still */ }
  }
  // Global verfuegbar machen (fuer Formular-Erfolg in kontakt/konfigurator/shop)
  window.hekuTrack = hekuTrack;

  var path = (location && location.pathname) ? location.pathname : "";

  // Ein Klick-Delegate fuer die ganze Seite -> keine doppelten Listener.
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";

    // Telefonklicks (auch aus der Sticky-Bar) -> eigenes Event, KEIN qualify_lead
    if (href.indexOf("tel:") === 0) {
      hekuTrack("phone_click", {
        link_url: href,
        link_text: (a.textContent || "").trim().slice(0, 100),
        page_location: (location && location.href) ? location.href : "",
        page_path: path
      });
      return;
    }
    // E-Mail-Klicks -> eigenes Event, KEIN qualify_lead
    if (href.indexOf("mailto:") === 0) {
      hekuTrack("email_click", {
        link_url: href,
        link_text: (a.textContent || "").trim().slice(0, 100),
        page_location: (location && location.href) ? location.href : "",
        page_path: path
      });
      return;
    }
  }, true);
})();
</script>
