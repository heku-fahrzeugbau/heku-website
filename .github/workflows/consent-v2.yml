name: Consent-Script auf v2 umstellen (einmalig)

# Ersetzt die Referenz /heku-consent.js durch /heku-consent-v2.js in allen
# HTML-Seiten und loescht die alte Datei.
#
# Grund: Cloudflare cached .js-Dateien aggressiv. Ein neuer Dateiname umgeht
# den Cache vollstaendig, ohne dass ein Purge noetig ist.
#
# Voraussetzung: heku-consent-v2.js liegt im Repo-Root.
# Manuell starten: Actions -> "Consent-Script auf v2 umstellen" -> Run workflow
# Danach diese Datei loeschen.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Voraussetzung pruefen
        run: |
          if [ ! -f heku-consent-v2.js ]; then
            echo "FEHLER: heku-consent-v2.js liegt nicht im Repo-Root. Abbruch."
            exit 1
          fi
          if ! grep -q 'u00fcber Cookies' heku-consent-v2.js; then
            echo "FEHLER: heku-consent-v2.js enthaelt nicht die korrigierten Umlaute."
            echo "Vermutlich wurde die falsche Datei hochgeladen. Abbruch."
            exit 1
          fi
          echo "heku-consent-v2.js gefunden und Umlaute korrekt."

      - name: Vorher
        run: |
          echo "Seiten mit Referenz auf heku-consent.js:"
          grep -l 'heku-consent\.js' *.html || echo "keine"

      - name: Referenz umstellen
        run: |
          sed -i 's|src="/heku-consent\.js"|src="/heku-consent-v2.js"|g' *.html
          echo "--- Ergebnis ---"
          echo "Seiten mit v2:"
          grep -c 'heku-consent-v2\.js' *.html | grep -v ':0' || echo "keine"
          echo
          echo "Verbleibende Referenzen auf die alte Datei (sollte leer sein):"
          grep -n 'src="/heku-consent\.js"' *.html || echo "  keine"

      - name: Reihenfolge erneut pruefen
        run: |
          fail=0
          for f in *.html; do
            grep -q 'heku-consent-v2.js' "$f" || continue
            c=$(grep -n 'heku-consent-v2.js' "$f" | head -1 | cut -d: -f1)
            g=$(grep -n 'googletagmanager.com/gtag/js' "$f" | head -1 | cut -d: -f1)
            if [ "$c" -lt "$g" ]; then
              echo "OK   $f (consent $c, gtag $g)"
            else
              echo "FEHLER $f (consent $c steht NACH gtag $g)"
              fail=1
            fi
          done
          exit $fail

      - name: Alte Datei entfernen
        run: |
          if [ -f heku-consent.js ]; then
            git rm heku-consent.js
            echo "heku-consent.js geloescht."
          fi

      - name: Committen
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nichts zu aendern."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Consent-Script auf v2 umgestellt, Umlaute korrigiert"
          git push
