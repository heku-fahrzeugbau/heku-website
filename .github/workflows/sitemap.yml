name: Sitemap generieren

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/**'
      - 'assets/produkte/**'
      - 'product-detail.css'
      - '.github/workflows/sitemap.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produktseiten bauen und alle Tests ausfuehren (kein Push/Deployment)
        run: |
          node scripts/build-site.mjs
          node --test scripts/test-seo.mjs scripts/test-products.mjs
  sitemap:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Aktuellen main auschecken (volle Historie fuer lastmod)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produktseiten und Sitemap generieren, Regressionen pruefen
        run: |
          node scripts/build-site.mjs
          node --test scripts/test-seo.mjs scripts/test-products.mjs
      - name: Abgeleitete Seiten committen, falls veraendert
        id: generated
        shell: bash
        run: |
          git add -- sitemap.xml shop.html artikel/ \
            windenstaende-winden.html stuetzraeder-bootsanhaenger.html \
            kielrollen-stuetzrollen.html auflagen-polsterkissen.html \
            raeder-reifen-bootsanhaenger.html beleuchtung-bootsanhaenger.html \
            weiteres-bootsanhaenger-zubehoer.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine abgeleiteten Aenderungen; normaler Benutzer-Push startet Pages."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Produktseiten und Sitemap aus Shop aktualisiert [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Bot commits do not automatically trigger branch-based Pages builds.
      - name: Pages nach Generator-Commit neu bauen
        if: steps.generated.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pages_type=$(gh api "repos/$GH_REPO/pages" --jq '.build_type')
          pages_branch=$(gh api "repos/$GH_REPO/pages" --jq '.source.branch')
          pages_path=$(gh api "repos/$GH_REPO/pages" --jq '.source.path')
          if [ "$pages_type" != "legacy" ] || [ "$pages_branch" != "main" ] || [ "$pages_path" != "/" ]; then
            echo "::error::Erwartet: Settings > Pages > Deploy from a branch: main / root. Konfiguration pruefen; Generator-Commit noch nicht als live bestaetigt."
            exit 1
          fi
          gh api --method POST "repos/$GH_REPO/pages/builds"
          echo "Build angefordert. pages-build-deployment und Live-Seiten kontrollieren."
