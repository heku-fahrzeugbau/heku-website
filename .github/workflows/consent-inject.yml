name: Consent-Script einbinden (einmalig)

# Fuegt heku-consent.js VOR dem gtag.js-Script in jede HTML-Seite ein.
# Die Reihenfolge ist entscheidend: Consent Mode muss gesetzt sein,
# bevor gtag.js laedt, sonst setzt GA4 sofort Cookies.
#
# Manuell starten: Actions -> "Consent-Script einbinden (einmalig)" -> Run workflow
# Danach diese Datei loeschen.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pruefen, ob heku-consent.js existiert
        run: |
          if [ ! -f heku-consent.js ]; then
            echo "FEHLER: heku-consent.js liegt nicht im Repo-Root. Abbruch."
            exit 1
          fi

      - name: Vorher
        run: |
          echo "Seiten mit gtag.js:"
          grep -l 'googletagmanager.com/gtag/js' *.html || echo "keine"
          echo
          echo "Seiten mit bereits eingebundenem Consent-Script:"
          grep -l 'heku-consent.js' *.html || echo "keine"

      - name: Einfuegen
        run: |
          for f in *.html; do
            # Ueberspringen, wenn schon vorhanden (idempotent)
            if grep -q 'heku-consent.js' "$f"; then
              echo "schon vorhanden: $f"
              continue
            fi
            # Ueberspringen, wenn kein gtag.js drin ist
            if ! grep -q 'googletagmanager.com/gtag/js' "$f"; then
              echo "kein gtag.js: $f"
              continue
            fi
            sed -i 's|<script async src="https://www.googletagmanager.com/gtag/js|<script src="/heku-consent.js"></script>\n  <script async src="https://www.googletagmanager.com/gtag/js|' "$f"
            echo "eingefuegt: $f"
          done

      - name: Kontrolle der Reihenfolge
        run: |
          echo "--- Pruefe, dass heku-consent.js VOR gtag.js steht ---"
          fail=0
          for f in *.html; do
            grep -q 'heku-consent.js' "$f" || continue
            c=$(grep -n 'heku-consent.js' "$f" | head -1 | cut -d: -f1)
            g=$(grep -n 'googletagmanager.com/gtag/js' "$f" | head -1 | cut -d: -f1)
            if [ "$c" -lt "$g" ]; then
              echo "OK   $f (consent Zeile $c, gtag Zeile $g)"
            else
              echo "FEHLER $f (consent Zeile $c steht NACH gtag Zeile $g)"
              fail=1
            fi
          done
          exit $fail

      - name: Committen
        run: |
          if git diff --quiet; then
            echo "Nichts zu aendern."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Consent-Manager auf allen Seiten eingebunden"
          git push
