name: Sitemap generieren

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/test-seo.mjs'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Aktuellen main auschecken (volle Historie fuer lastmod)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sitemap generieren und SEO-Regressionen pruefen
        run: |
          node scripts/generate-sitemap.mjs
          node --test scripts/test-seo.mjs
      - name: Committen, falls veraendert
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unveraendert, kein Commit noetig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: sitemap.xml mit lastmod aktualisiert [skip ci]"
          git push
