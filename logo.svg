    </pattern>
    <pattern id="black" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#050505"/>
      <rect width="7" height="18" fill="#2b2b27"/>
    </pattern>
  </defs>

